<!--<form [formGroup]="rocketForm" (ngSubmit)="calculate()" class="calculator-form">-->
<div class="calculator-form">

  <!-- Desired Range Section -->
  <div  class="calc-section">
    <label class="section-label">Desired Range</label>
    <select #range
            (change)="selectRange(Number(range.value))"
            class="section-input"
    >
      @for(option of rangeOptions; track option.value) {
        <option [value]="option.value">
          {{ option.label }}
        </option>
      }
    </select>
  </div>

  <div class="calc-section">
    <label class="section-label">Engine</label>
    <select #engine (change)="selectEngine(engine.value)" class="section-input">
      @for(option of engineOptions; track option.label) {
        <option [value]="option.label">
          {{ option.label }}
        </option>
      }
    </select>
    <label class="section-label">Solid fuel thrusters</label>
    <input
      #st
      type="number"
      placeholder="0"
      class="section-input"
      (input)="setSolidThrusters(st.valueAsNumber)"
    />
  </div>

  <!-- Fuel Section -->
  <div class="calc-section">
    <label class="section-label">Fuel tanks</label>
    <input
      type="number"
      [value]="fuelTanks()"
      class="section-input"
      disabled="disabled"
    />
    <label class="section-label">Fuel amount</label>
    <input
      #fuelAmount
      type="number"
      placeholder="0"
      class="section-input"
      (input)="setFuelAmount(fuelAmount.valueAsNumber)"
    />
  </div>

<!--  Oxidizer -->
  @if (selectedEngine() !== 'Steam') {
    <div class="calc-section">
      <label class="section-label-header">Oxidizer</label>
      <label class="section-label">Oxidizer Type</label>
      <select #oxidizer
              (change)="selectedOxidizer.set(oxidizer.value)"
              class="section-input"
      >
        @for(option of oxidizerOptions; track option.label) {
          <option [value]="option.label">
            {{ option.label }}
          </option>
        }
      </select>
      <label class="section-label">Oxidizer Tanks</label>
      <input
        type="number"
        [value]="oxiTanks()"
        class="section-input"
        disabled="disabled"
      />
      <label class="section-label">Fuel</label>
      <input
        #oxiAm
        type="number"
        [value]="oxiAmount()"
        class="section-input"
        (input)="setOxidizerAmount(oxiAm.valueAsNumber)"
        disabled="disabled"
      />
    </div>
  }

  <div class="calc-section">
    <label class="section-label-header">Modules</label>
    <label class="section-label">Command Capsule</label>
    <input
      type="number"
      placeholder="1"
      disabled="disabled"
      class="section-input"
    />
    <label class="section-label">Solid Cargo Bays</label>
    <input
      #scb
      type="number"
      class="section-input"
      min="0"
      max="10"
      [value]="sCargoBays()"
      (input)="sCargoBays.set(scb.valueAsNumber)"
    />
    <label class="section-label">Liquid Cargo Tanks</label>
    <input
      #lcb
      type="number"
      class="section-input"
      min="0"
      max="10"
      [value]="lCargoBays()"
      (input)="lCargoBays.set(lcb.valueAsNumber)"
    />
    <label class="section-label">Research Modules</label>
    <input
      #rm
      type="number"
      class="section-input"
      min="0"
      max="10"
      [value]="resModule()"
      (input)="resModule.set(rm.valueAsNumber)"
    />
    <label class="section-label">Gas Cargo Canisters</label>
    <input
      #gcb
      type="number"
      class="section-input"
      min="0"
      max="10"
      [value]="gCargoBays()"
      (input)="gCargoBays.set(gcb.valueAsNumber)"
    />
    <label class="section-label">Biological Cargo Bays</label>
    <input
      #bcb
      type="number"
      class="section-input"
      min="0"
      max="10"
      [value]="bCargoBays()"
      (input)="bCargoBays.set(bcb.valueAsNumber)"
    />
    <label class="section-label">Sight-Seeing Modules</label>
    <input
      #ssm
      type="number"
      class="section-input"
      min="0"
      max="10"
      [value]="ssModule()"
      (input)="ssModule.set(ssm.valueAsNumber)"
    />
  </div>

  <!-- Action -->
  <button (click)="test()" type="submit" class="calculate-btn">
    Calculate
  </button>

</div>
